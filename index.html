const rulesText=()=>{const guru=CFG.guruEmail||"guru@domain-anda.com";return `-- Jalankan SQL ini di Supabase > SQL Editor.
-- Ganti email guru di CFG.guruEmail sebelum menjalankan SQL ini.
-- Aktifkan Anonymous Sign-ins dan buat akun guru pada Authentication > Users.

create table if not exists public.siswa (
 id text primary key, nama text not null, kode text not null, uid uuid not null,
 skor numeric default 0, maks numeric default 100, nilai numeric default 0,
 benar integer default 0, salah integer default 0, jawab integer default 0,
 prog numeric default 0, status text default 'Belum mulai', sm boolean default false,
 hal text, aksi text, pos jsonb default '{}'::jsonb, det jsonb default '{}'::jsonb,
 tm jsonb default '{}'::jsonb, mulai timestamptz, selesai timestamptz,
 last timestamptz default now()
);
create table if not exists public.log (
 id bigint generated by default as identity primary key,
 siswa_id text not null references public.siswa(id) on delete cascade,
 t timestamptz default now(), tipe text, teks text
);
alter table public.siswa enable row level security;
alter table public.log enable row level security;

drop policy if exists "siswa_read_self_or_teacher" on public.siswa;
create policy "siswa_read_self_or_teacher" on public.siswa for select to authenticated
using (uid = auth.uid() or auth.jwt()->>'email' = '${guru}');
drop policy if exists "siswa_insert_self" on public.siswa;
create policy "siswa_insert_self" on public.siswa for insert to authenticated
with check (uid = auth.uid() and id like auth.uid()::text || '\\_%' escape '\\');
drop policy if exists "siswa_update_self" on public.siswa;
create policy "siswa_update_self" on public.siswa for update to authenticated
using (uid = auth.uid() and id like auth.uid()::text || '\\_%' escape '\\')
with check (uid = auth.uid() and id like auth.uid()::text || '\\_%' escape '\\');
drop policy if exists "teacher_delete_siswa" on public.siswa;
create policy "teacher_delete_siswa" on public.siswa for delete to authenticated
using (auth.jwt()->>'email' = '${guru}');
drop policy if exists "log_insert_owner" on public.log;
create policy "log_insert_owner" on public.log for insert to authenticated
with check (exists(select 1 from public.siswa s where s.id=siswa_id and s.uid=auth.uid()));
drop policy if exists "log_read_teacher" on public.log;
create policy "log_read_teacher" on public.log for select to authenticated
using (auth.jwt()->>'email' = '${guru}');
drop policy if exists "log_delete_teacher" on public.log;
create policy "log_delete_teacher" on public.log for delete to authenticated
using (auth.jwt()->>'email' = '${guru}');

-- Hak akses API untuk pengguna yang sudah login
grant select, insert, update, delete on public.siswa to authenticated;
grant select, insert, delete on public.log to authenticated;
-- Tambahkan tabel siswa dan log ke Database > Publications > supabase_realtime.
`};

function err(t){const e=$("#er");e.textContent=t;e.hidden=false}
let joining=false;
async function mulai(){if(joining)return;const n=$("#nm").value.trim().replace(/\s+/g," "),k=$("#kd").value.trim().toUpperCase().replace(/\s+/g,"");
 if(n.length<2)return err("Tulis namamu dulu, minimal 2 huruf ya.");if(k.length<2)return err("Tulis kode kelasmu dulu ya.");
 joining=true;const bt=document.querySelector('button[onclick="mulai()"]');if(bt){bt.disabled=true;bt.textContent="Menghubungkan..."}
 S={role:"siswa",guru:false,nama:n,kode:k,ans:{},tmp:{},fail:0,until:0,pop:false,sm:false,fin:false,isNew:true};
 DB.q={};DB.lq=[];DB.id=null;let cloud=null;
 if(DB.sb){
  try{DB.uid=await DB.anon();DB.id=DB.uid+"_"+keyOf()}catch(e){DB.uid=null;DB.id=null;alert("Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.")}
  if(DB.id){try{cloud=await DB.getOwn()}catch(e){if(e&&e.code==="permission-denied"){DB.id=null;alert("Pengaturan akses Supabase (RLS) belum benar. Beri tahu gurumu.")}}}}
 const k0=keyOf(),ses=loadSes(k0),cans=cloud&&cloud.det?ansFrom(cloud.det):{},lans=ses&&ses.ans?ses.ans:{},nl=Object.keys(lans).length,nc=Object.keys(cans).length;
 let pos=null,back=false;
 if(nl&&nl>=nc){S.ans=lans;S.tmp=ses.tmp||{};pos=ses.pos;back=true}
 else if(nc){S.ans=cans;S.tmp=cloud.tm||{};pos=cloud.pos?{v:cloud.pos.v,p:{l:cloud.pos.l,i:cloud.pos.i}}:null;back=true}
 else{const old=lsGet()[k0];if(old&&old.det){S.ans=ansFrom(old.det);back=Object.keys(S.ans).length>0}}
 if(cloud){S.isNew=false;S.sm=!!cloud.sm}
 if(back)S.sm=true;
 S.fin=!!cloud&&allDone();
 save("masuk",back?"Masuk kembali":"Bergabung",S.isNew?{mulai:DB.ts()}:null);
 joining=false;burst(10);
 const r=back?resumePos({pos}):null;go(...(r||["peta"]));if(back)plus("Selamat datang kembali! 👋")}
function ulang(){S.ans={};S.tmp={};S.fin=false;save("ulang","Mengulang pembelajaran dari awal",{det:DB.clr(),tm:DB.clr(),selesai:DB.del()});go("peta")}
async function masuk(){if(Date.now()<S.until)return err("Terlalu banyak percobaan. Tunggu 30 detik.");
 const pw=$("#pw").value;let ok=false,msg="Sandi salah.";
 try{if(DB.sb){const em=CFG.guruEmail||($("#em")?$("#em").value.trim():"");if(!em)return err("Masukkan email guru.");const {error}=await DB.sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;ok=true}
  else{let s=null;try{s=localStorage.getItem("kp_pw")}catch(e){}ok=h53("kp:"+pw)===(s||CFG.teacherHash)}}
 catch(e){ok=false;const c=e&&e.code;
  if(c==="auth/network-request-failed")return err("Tidak ada koneksi internet. Coba lagi.");
  if(c==="auth/too-many-requests")return err("Terlalu banyak percobaan. Tunggu beberapa menit.");
  if(c==="auth/operation-not-allowed")return err("Login Email/Password belum diaktifkan di Supabase.");
  msg="Sandi salah, atau akun guru belum dibuat di Supabase."}
 if(!ok){if(++S.fail>=5){S.until=Date.now()+30000;S.fail=0}return err(msg)}
 S.role="guru";S.guru=true;go("dash")}
function gantiSandi(){const p=prompt("Sandi baru (minimal 6 karakter):");if(!p)return;if(p.length<6)return alert("Sandi terlalu pendek.");try{localStorage.setItem("kp_pw",h53("kp:"+p));alert("Sandi diganti. Catatan: sandi ini hanya berlaku di browser ini.")}catch(e){alert("Gagal menyimpan sandi.")}}
function hapusSemua(){if(confirm("Hapus SEMUA data siswa? Tindakan ini tidak dapat dibatalkan."))DB.clear().then(()=>{ROWS=[];FEED=[];PREV={};V.p.rows=DB.sb?ROWS:null;render(1)}).catch(()=>alert("Gagal menghapus. Periksa koneksi dan aturan Supabase."))}
function hapusSiswa(k){if(confirm("Hapus data siswa ini? Tindakan ini tidak dapat dibatalkan."))DB.del1(k).then(()=>go("dash")).catch(()=>alert("Gagal menghapus. Periksa koneksi dan aturan Supabase."))}
function dl(name,head,rows){const q=v=>{v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const b=new Blob(["\ufeff"+[head.map(q).join(",")].concat(rows.map(r=>r.map(q).join(","))).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

 if(p>0){plus("+"+fm(p));burst(full?16:6);S.pop=true}
 save("jawab","Soal "+(qsOf(q.lv).indexOf(q)+1)+" Level "+q.lv+": "+S.ans[q.id].j+" ("+(full?"benar":p>0?"sebagian benar":"salah")+", "+fm(p)+" poin)");render(1)}

/* ===== CONTOH AUDIO DAN ILUSTRASI ===== */
const SFX={c:null,get(){if(!this.c){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.c=new A()}this.c.resume();return this.c},
 tone(f,t,d,ty,v){const c=this.c,o=c.createOscillator(),g=c.createGain();o.type=ty||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)},
 drum(t,hi){const c=this.c,o=c.createOscillator(),g=c.createGain();o.type=hi?"square":"sine";o.frequency.setValueAtTime(hi?900:170,t);if(!hi)o.frequency.exponentialRampToValueAtTime(55,t+.15);g.gain.setValueAtTime(hi?.08:.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+(hi?.06:.22));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.3)},
 p(k,i){if(MUS.on)MUS.stop();const c=this.get();if(!c)return;const t=c.currentTime+.05,B=.5;
  if(k==="irama")this.tone(262,t,[4,2,1,.5][i]*B*.95);
  if(k==="nada"){[[261.63,293.66,329.63,349.23,392,440,493.88,523.25],[220,246.94,261.63,293.66,329.63,349.23,392,440]][i].forEach((f,n)=>this.tone(f,t+n*.4,.38))}
  if(k==="tempo"){const d=60/[50,80,100,130,180][i];for(let n=0;n<6;n++)this.tone(n%2?330:262,t+n*d,Math.min(d*.8,.4))}
  if(k==="alat"){if(i===0)[392,440,494,523,494,440,392].forEach((f,n)=>this.tone(f,t+n*.3,.3,"sine"));
   if(i===1)for(let n=0;n<8;n++)this.drum(t+n*.25,n%2)
   if(i===2){[262,330,392].forEach(f=>this.tone(f,t,1.6,"triangle",.18));[262,330,392,330].forEach((f,n)=>this.tone(f/2,t+1.7+n*.3,.3,"triangle",.25))}}}};
const ab=(l,k,i)=>'<button class="btn warn" onclick="SFX.p(\''+k+'\','+i+')">🔊 '+l+'</button>';
const cards=a=>'<div class="exg">'+a.map(x=>'<div class="exc"><div class="exe">'+x[0]+'</div><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join("")+'</div>';
const nb=[["Not penuh",4],["Not setengah",2],["Not seperempat",1],["Not seperdelapan",.5]];

M[1].ex='<b>🔊 Dengarkan contoh</b><p style="margin:4px 0">Bandingkan perasaan dua tangga nada:</p>'+ab("Mayor (ceria)","nada",0)+ab("Minor (sedih)","nada",1)+'<p style="margin:8px 0 4px">Bandingkan kecepatan tempo:</p>'+["Largo","Andante","Moderato","Allegro","Presto"].map((x,i)=>ab(x,"tempo",i)).join("");
M[2].ex='<b>🔊 Bunyi contoh (tiruan sederhana)</b>'+ab("Melodis","alat",0)+ab("Ritmis","alat",1)+ab("Harmonis","alat",2)+cards([["🎹","Pianika, suling, biola","melodis"],["🥁","Gendang, rebana, tamborin","ritmis"],["🎸","Gitar, piano","harmonis"]]);
M[3].ex='<b>🖼️ Contoh gerak dan watak</b>'+cards([["🕊️","Gerak maknawi","tangan mengepak seperti burung"],["🌀","Gerak murni","melenggang indah tanpa arti"],["💪","Watak gagah","gerak tegas dan kuat"],["🌸","Watak anggun","gerak lembut dan halus"],["🤡","Watak lucu","gerak jenaka"]]);
M[4].ex='<b>🖼️ Contoh properti tari</b>'+cards([["🧣","Selendang","Tari Jaipong"],["☂️","Payung","Tari Payung"],["🎭","Topeng","Tari Topeng Cirebon"]]);

M[6].ex='<b>🖼️ Contoh cerita rakyat</b>'+cards([["🌾","Timun Mas","kecerdikan melawan raksasa"],["🪨","Malin Kundang","jangan durhaka pada ibu"],["⛰️","Sangkuriang","legenda Tangkuban Perahu"],["⚔️","Si Pitung","pembela rakyat kecil"]]);
M[7].ex='<b>🖼️ Contoh seni daerah dan permainan</b>'+cards([["👘","Batik","Pekalongan, Solo, Yogyakarta"],["🧵","Tenun","NTT"],["🏺","Gerabah","Kasongan"],["🎲","Congklak","biji dan papan berlubang"],["🦿","Egrang","berjalan di tongkat"],["👥","Gobak sodor","permainan regu"],["🔢","Engklek","melompat di petak angka"]]);

/* ===== MUSIK LATAR (dibuat langsung oleh browser, tanpa file audio) ===== */
const MUS={ctx:null,m:null,nb:null,on:false,ever:false,tm:null,st:0,nt:0,wasOn:false,BPM:104,
 F:[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],
 MEL:[5,-1,7,8,7,-1,5,-1, 6,-1,8,9,8,-1,6,-1, 4,-1,5,6,5,-1,4,-1, 5,6,7,-1,6,5,3,-1, 5,-1,7,8,9,-1,8,7, 8,-1,7,6,7,-1,5,-1, 6,7,8,-1,7,6,5,-1, 5,-1,3,-1,5,-1,-1,-1],
 ROOT:[130.81,98,110,87.31,130.81,98,87.31,130.81],
 start(){try{
  if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=this.ctx=new A(),k=c.createDynamicsCompressor(),g=c.createGain();g.gain.value=.5;g.connect(k);k.connect(c.destination);this.m=g;
   const b=this.nb=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  this.ctx.resume();this.ever=true;
  if(!this.on){this.on=true;this.st=0;this.nt=this.ctx.currentTime+.08;this.tm=setInterval(()=>this.tick(),60)}
  document.body.classList.add("mon")}catch(e){}this.ui()},
 stop(){this.on=false;clearInterval(this.tm);this.tm=null;document.body.classList.remove("mon");this.ui()},
 toggle(){this.on?this.stop():this.start()},
 ui(){const b=document.getElementById("mbtn");if(!b)return;b.textContent=this.on?"🎵 Musik: Nyala":this.ever?"🔇 Musik: Mati":"🎵 Putar Musik";b.setAttribute("aria-pressed",String(this.on));b.classList.toggle("pulse",!this.ever)},
 tick(){const c=this.ctx;while(this.nt<c.currentTime+.25){this.play(this.st%64,this.nt);this.nt+=60/this.BPM/2;this.st++}},
 play(s,t){const b=s%8,bar=s>>3,n=this.MEL[s];
  if(n>=0){this.pluck(this.F[n],t,.3,.18);this.pluck(this.F[n],t+.13,.12,.08)}
  if(b===0||b===4){this.bass(this.ROOT[bar],t,1);this.kick(t)}
  if(b===2||b===6){this.bass(this.ROOT[bar]*1.5,t,.55);this.block(t)}
  this.hat(t,b%2?.6:.3)},
 env(o,t,v,d){const g=this.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05)},
 osc(ty,f,t,v,d){const o=this.ctx.createOscillator();o.type=ty;o.frequency.value=f;this.env(o,t,v,d)},
 pluck(f,t,v,d){this.osc("triangle",f,t,v,d+.35);this.osc("sine",f*2,t,v*.35,d+.2)},
 bass(f,t,k){this.osc("sine",f,t,.55*k,.32);this.osc("triangle",f*2,t,.12*k,.2)},
 kick(t){const o=this.ctx.createOscillator();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);this.env(o,t,.7,.2)},
 block(t){this.osc("triangle",950,t,.16,.07)},
 hat(t,v){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type="highpass";f.frequency.value=7000;g.gain.setValueAtTime(.07*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+.06)}
};
function firstTap(e){if(MUS.ever)return;if(e.target&&e.target.closest&&e.target.closest("#mbtn"))return;MUS.start()}
document.addEventListener("click",firstTap,true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")firstTap(e)},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden){MUS.wasOn=MUS.on;if(MUS.on)MUS.stop()}else if(MUS.wasOn){MUS.wasOn=false;MUS.start()}});
window.addEventListener("blur",()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==="IFRAME"&&MUS.on)MUS.stop()},0));
