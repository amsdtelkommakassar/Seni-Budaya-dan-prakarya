  <body>
    <div id="hud"></div>
    <main id="app"></main>
    <button
      id="mbtn"
      class="btn warn mbtn pulse"
      onclick="MUS.toggle()"
      aria-pressed="false"
    >
      🎵 Putar Musik
    </button>
    <script>
      "use strict";
      /* ==========================================================================
   KONFIGURASI
   Supabase: isi projectUrl dan publishableKey di bawah.
   Gunakan publishable key saja. Jangan pernah menaruh sb_secret/service_role di HTML.
   ========================================================================== */
      const CFG = {
        supabase: {
          table: "hasil_kuis", // ganti jika memakai tabel Supabase lain untuk MTK
          projectUrl: "https://lylsyyxzgwkltrkfhsyy.supabase.co",
          publishableKey: "sb_publishable_746ZFXjiFwyFdPgUf2TI1Q_XWm-VR8_",
        },
      };
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const h53 = (s) => {
        let a = 0xdeadbeef,
          b = 0x41c6ce57;
        for (let i = 0; i < s.length; i++) {
          const c = s.charCodeAt(i);
          a = Math.imul(a ^ c, 2654435761);
          b = Math.imul(b ^ c, 1597334677);
        }
        a = Math.imul(a ^ (a >>> 16), 2246822507);
        a ^= Math.imul(b ^ (b >>> 13), 3266489909);
        b = Math.imul(b ^ (b >>> 16), 2246822507);
        b ^= Math.imul(a ^ (a >>> 13), 3266489909);
        return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
      };
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const fm = (n) => String(Math.round(n * 10) / 10).replace(".", ",");

      /* ===== PENYIMPANAN SUPABASE ===== */
      function lsGet() {
        try {
          return JSON.parse(localStorage.getItem("sbk_hasil") || "{}");
        } catch (e) {
          return {};
        }
      }
      function lsSet(r) {
        try {
          const o = lsGet();
          o[r.k] = r;
          localStorage.setItem("sbk_hasil", JSON.stringify(o));
        } catch (e) {}
      }
      const DB = {
        sb: null,
        note: "",
        un: null,
        uid: null,
        async init() {
          const c = CFG.supabase;
          if (
            !c.projectUrl ||
            c.projectUrl.includes("ISI_PROJECT_URL") ||
            !c.publishableKey
          ) {
            DB.note =
              "Isi Project URL Supabase pada CFG.supabase agar data tersimpan online.";
            return;
          }
          try {
            await new Promise((ok, no) => {
              const s = document.createElement("script");
              s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
              s.onload = ok;
              s.onerror = no;
              document.head.appendChild(s);
            });
            DB.sb = window.supabase.createClient(
              c.projectUrl,
              c.publishableKey,
            );
          } catch (e) {
            DB.note = "Supabase gagal dimuat. Periksa koneksi dan konfigurasi.";
          }
        },
        async anon() {
          const { data, error } = await DB.sb.auth.getSession();
          if (error) throw error;
          let u = data.session?.user;
          if (!u || !u.is_anonymous) {
            const r = await DB.sb.auth.signInAnonymously();
            if (r.error) throw r.error;
            u = r.data.user;
          }
          return u.id;
        },
        async put(r) {
          lsSet(r);

          if (!DB.sb || !DB.uid) {
            console.warn(
              "Supabase belum terhubung atau UID siswa belum tersedia.",
            );
            return false;
          }

          const row = {
            user_id: DB.uid,
            nama_siswa: r.nama,
            kelas: r.kode,
            nilai: r.nilai,
            skor: r.skor,
            maks: r.maks,
            benar: r.benar,
            salah: r.salah,
            jawab: r.jawab,
            prog: r.prog,
            status: r.status,
            detail_jawaban: r.det,
            created_at: r.t,
          };

          const { error } = await DB.sb
            .from(CFG.supabase.table)
            .upsert(row, { onConflict: "user_id" });

          if (error) {
            console.error("Gagal menyimpan hasil siswa:", error);
            return false;
          }

          console.log("Hasil siswa berhasil disimpan ke Supabase.");
          return true;
        },
        async watch(ok, no) {
          DB.stop();
          const load = async () => {
            const { data, error } = await DB.sb
              .from(CFG.supabase.table)
              .select(
                "user_id,nama_siswa,kelas,nilai,skor,maks,benar,salah,jawab,prog,status,detail_jawaban,created_at",

      /* ===== AKSI ===== */
      function err(t) {
        const e = $("#er");
        e.textContent = t;
        e.hidden = false;
      }
      async function mulai() {
        const n = $("#nm").value.trim().replace(/\s+/g, " "),
          k = $("#kd").value.trim().toUpperCase().replace(/\s+/g, "");
        if (n.length < 2) return err("Tulis namamu dulu, minimal 2 huruf ya.");
        if (k.length < 2) return err("Tulis kode kelasmu dulu ya.");
        S = {
          role: "siswa",
          guru: false,
          nama: n,
          kode: k,
          ans: {},
          tmp: {},
          fail: 0,
          until: 0,
          pop: false,
        };
        if (DB.sb) {
          try {
            DB.uid = await DB.anon();
          } catch (e) {
            DB.uid = null;
            alert(
              "Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.",
            );
          }
        }
        const k0 = keyOf(),
          ses = loadSes(k0);
        let back = false;
        if (ses && ses.ans && Object.keys(ses.ans).length) {
          S.ans = ses.ans;
          S.tmp = ses.tmp || {};
          back = true;
        } else {
          const old = lsGet()[k0];
          if (old && old.det) {
            Object.keys(old.det).forEach((id) => {
              const q = Qb(+id);
              if (q)
                S.ans[q.id] = {
                  p: old.det[id],
                  sel: -1,
                  e: old.det[id] === q.w ? "senang" : "pikir",
                  m: "Jawabanmu tadi sudah tersimpan.",
                };
            });
            back = Object.keys(S.ans).length > 0;
          }
        }
        save();
        burst(10);
        const r = back ? resumePos(ses) : null;
        go(...(r || ["peta"]));
        if (back) plus("Selamat datang kembali! 👋");
      }
      function ulang() {
        S.ans = {};
        S.tmp = {};
        save();
        go("peta");
      }
      async function masuk() {
        if (Date.now() < S.until)
          return err("Terlalu banyak percobaan. Tunggu 30 detik.");
        const pw = $("#pw").value;
        let ok = false;
        try {
          if (DB.sb) {
            const { data, error } = await DB.sb.auth.signInWithPassword({
              email: $("#em").value.trim(),
              password: pw,
            });
            if (error) throw error;
            const check = await DB.sb
              .from("guru_access")
              .select("user_id")
              .eq("user_id", data.user.id)
              .maybeSingle();
            if (check.error || !check.data)
              throw new Error("Akun ini belum diberi akses guru.");
            ok = true;
          } else {
            let s = null;
            try {
              s = localStorage.getItem("sbk_pw");
            } catch (e) {}
            if (!s) {
              if (pw.length < 6)
                return err("Buat sandi baru, minimal 6 karakter.");
              try {
                localStorage.setItem("sbk_pw", h53("sbk:" + pw));
              } catch (e) {}
              ok = true;
            } else ok = h53("sbk:" + pw) === s;
          }
        } catch (e) {
          ok = false;
        }
        if (!ok) {
          if (++S.fail >= 5) {
            S.until = Date.now() + 30000;
            S.fail = 0;
          }
          return err(
            DB.sb
              ? "Email/sandi salah atau akun belum terdaftar sebagai guru."
              : "Sandi salah.",
          );
        }
        S.role = "guru";
        S.guru = true;
        go("dash");
      }
      function gantiSandi() {
        const p = prompt("Sandi baru (minimal 6 karakter):");
        if (!p) return;
        if (p.length < 6) return alert("Sandi terlalu pendek.");
        try {
          localStorage.setItem("sbk_pw", h53("sbk:" + p));
          alert(
            "Sandi diganti. Catatan: sandi ini hanya berlaku di browser ini.",
          );
        } catch (e) {
          alert("Gagal menyimpan sandi.");
        }
      }
      async function hapusSemua() {
        if (
          !confirm(
            "Hapus SEMUA data nilai siswa? Tindakan ini tidak dapat dibatalkan.",
          )
        )
          return;

        try {
          await DB.clear();
          alert("Data siswa berhasil dihapus.");
          V.p.rows = null;
          render(1);
        } catch (e) {
          console.error("Gagal menghapus data:", e);
          alert("Gagal menghapus data: " + (e.message || e));
        }
      }
      function csv() {
        const q = (v) => {
            v = String(v);
            if (/^[=+\-@]/.test(v)) v = "'" + v;
            return '"' + v.replace(/"/g, '""') + '"';
          },
          f = V.p.f || "";
        const rows = (V.p.rows || [])
          .filter((r) => !f || r.kode === f)
          .map((r) =>

              k.connect(c.destination);
              this.m = g;
              const b = (this.nb = c.createBuffer(
                  1,
                  Math.floor(c.sampleRate * 0.5),
                  c.sampleRate,
                )),
                d = b.getChannelData(0);
              for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            this.ctx.resume();
            this.ever = true;
            if (!this.on) {
              this.on = true;
              this.st = 0;
              this.nt = this.ctx.currentTime + 0.08;
              this.tm = setInterval(() => this.tick(), 60);
            }
            document.body.classList.add("mon");
          } catch (e) {}
          this.ui();
        },
        stop() {
          this.on = false;
          clearInterval(this.tm);
          this.tm = null;
          document.body.classList.remove("mon");
          this.ui();
        },
        toggle() {
          this.on ? this.stop() : this.start();
        },
        ui() {
          const b = document.getElementById("mbtn");
          if (!b) return;
          b.textContent = this.on
            ? "🎵 Musik: Nyala"
            : this.ever
              ? "🔇 Musik: Mati"
              : "🎵 Putar Musik";
          b.setAttribute("aria-pressed", String(this.on));
          b.classList.toggle("pulse", !this.ever);
        },
        tick() {
          const c = this.ctx;
          while (this.nt < c.currentTime + 0.25) {
            this.play(this.st % 64, this.nt);
            this.nt += 60 / this.BPM / 2;
            this.st++;
          }
        },
        play(s, t) {
          const b = s % 8,
            bar = s >> 3,
            n = this.MEL[s];
          if (n >= 0) {
            this.pluck(this.F[n], t, 0.3, 0.18);
            this.pluck(this.F[n], t + 0.13, 0.12, 0.08);
          }
          if (b === 0 || b === 4) {
            this.bass(this.ROOT[bar], t, 1);
            this.kick(t);
          }
          if (b === 2 || b === 6) {
            this.bass(this.ROOT[bar] * 1.5, t, 0.55);
            this.block(t);
          }
          this.hat(t, b % 2 ? 0.6 : 0.3);
        },
        env(o, t, v, d) {
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(v, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g);
          g.connect(this.m);
          o.start(t);
          o.stop(t + d + 0.05);
        },
        osc(ty, f, t, v, d) {
          const o = this.ctx.createOscillator();
          o.type = ty;
          o.frequency.value = f;
          this.env(o, t, v, d);
        },
        pluck(f, t, v, d) {
          this.osc("triangle", f, t, v, d + 0.35);
          this.osc("sine", f * 2, t, v * 0.35, d + 0.2);
        },
        bass(f, t, k) {
          this.osc("sine", f, t, 0.55 * k, 0.32);
          this.osc("triangle", f * 2, t, 0.12 * k, 0.2);
        },
        kick(t) {
          const o = this.ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
          this.env(o, t, 0.7, 0.2);
        },
        block(t) {
          this.osc("triangle", 950, t, 0.16, 0.07);
        },
        hat(t, v) {
          const c = this.ctx,
            s = c.createBufferSource(),
            f = c.createBiquadFilter(),
            g = c.createGain();
          s.buffer = this.nb;
          f.type = "highpass";
          f.frequency.value = 7000;
          g.gain.setValueAtTime(0.07 * v, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          s.connect(f);
          f.connect(g);
          g.connect(this.m);
          s.start(t);
          s.stop(t + 0.06);
        },
      };
      function firstTap(e) {
        if (MUS.ever) return;
        if (e.target && e.target.closest && e.target.closest("#mbtn")) return;
        MUS.start();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Enter" || e.key === " ") firstTap(e);
        },
        true,
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          MUS.wasOn = MUS.on;
          if (MUS.on) MUS.stop();
        } else if (MUS.wasOn) {
          MUS.wasOn = false;
          MUS.start();
        }
      });
      window.addEventListener("blur", () =>
        setTimeout(() => {
          const a = document.activeElement;
          if (a && a.tagName === "IFRAME" && MUS.on) MUS.stop();
        }, 0),
      );

      /* ===== TAMBAHAN: VIDEO DI PETA, MATERI AWAL, DAN TOMBOL 🎬 ===== */
      const _peta = VIEWS.peta, _mat = VIEWS.materi, _hud = hud;
      VIEWS.peta = () => _peta() + ytCard("🎬 Video Pembelajaran", "Tonton lagi kapan saja tanpa keluar dari halaman ini.");
      VIEWS.materi = () => _mat() + (V.p.l === 1 && V.p.i === 0 ? ytCard("🎬 Tonton Videonya Dulu", "Video diputar langsung di sini. Matikan musik 🎵 saat menonton.") : "");
      hud = function () {
        _hud();
        const b = document.querySelector('#hud button[aria-label="Ke peta"]');
        if (b) b.insertAdjacentHTML("afterend", ' <button class="btn ghost" style="min-height:34px;padding:4px 10px;margin:0" onclick="vid()" aria-label="Tonton video">🎬</button>');
      };

      DB.init().then(() => render());
    </script>
  </body>
